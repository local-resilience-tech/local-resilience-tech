{{ define "main" }}
  <div class="with-side-nav floating-side-nav on-light-blue">
    {{- with .Menus }}
      {{- range $menuID, $_ := . }}
        {{ partial "side_nav.html" (dict "menuID" $menuID "page" $) }}
      {{- end }}
    {{- end }}

    <div class="content">
      <article class="docs-page">
        <h1>{{ .Title }}</h1>

        {{ .Content }} {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
      </article>
    </div>
  </div>
{{ end }}
