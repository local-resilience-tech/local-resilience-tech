{{ define "main" }}
  <div class="on-light-blue with-side-nav floating-side-nav">
    {{- with .Menus }}
      {{- range $menuID, $_ := . }}
        {{ partial "side_nav.html" (dict "menuID" $menuID "page" $) }}
      {{- end }}
    {{- end }}

    <div class="contents">
      <article class="page blog-page on-light-blue">
        <div class="header">
          <h1>{{ .Title }}</h1>
        </div>

        {{ .Content }}

        <div class="post-list">
          {{ range .Pages }}
            <a href="{{ .RelPermalink }}" class="post-link">
              <div class="post-header">
                <h2>{{ .LinkTitle }}</h2>
              </div>
              <div class="post-summary">
                {{ .Summary }}
              </div>
            </a>
          {{ end }}
        </div>
      </article>
    </div>
  </div>
{{ end }}
