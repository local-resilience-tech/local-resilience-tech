{{ define "main" }}
  <div class="blog-list-page on-burnt-orange">
    <div class="contents">
      <div class="header">
        <h1>Blog</h1>
        <a href="index.xml" class="rss-link">
          Subscribe with RSS
          <svg class="rss-icon" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 455.731 455.731" xml:space="preserve">
            <g>
              <g>
                <path d="M296.208,159.16C234.445,97.397,152.266,63.382,64.81,63.382v64.348
                  c70.268,0,136.288,27.321,185.898,76.931c49.609,49.61,76.931,115.63,76.931,185.898h64.348
                  C391.986,303.103,357.971,220.923,296.208,159.16z"/>
                <path d="M64.143,172.273v64.348c84.881,0,153.938,69.056,153.938,153.939h64.348
                  C282.429,270.196,184.507,172.273,64.143,172.273z"/>
                <circle cx="109.833" cy="346.26" r="46.088"/>
              </g>
            </g>
          </svg>
        </a>
      </div>

      {{ .Content }}

      <div class="post-list">
        {{ range .Pages }}
          <a href="{{ .RelPermalink }}" class="post-link">
            <div class="post-header">
              <h2>{{ .LinkTitle }}</h2>
              {{- if not .PublishDate.IsZero -}}
                <div class="post-date">{{- .PublishDate.Format "Jan 2, 2006" -}}</div>
              {{- end -}}
            </div>
            {{ .Summary }}
          </a>
        {{ end }}
      </div>
    </div>
  </div>
{{ end }}
